services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build: ./src
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://chat:chat@postgres:5432/chat
    ports: ["8000:8000"]
    volumes: [./src:/app]
    depends_on: [postgres]

  web:
    build: ./src/web
    ports: ["5173:5173"]
    volumes: [./src/web/src:/app/src]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
