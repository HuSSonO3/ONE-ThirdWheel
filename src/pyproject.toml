[project]
name = "company-chat"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "pyyaml>=6.0.3",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "email-validator>=2.3.0",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "openapi-spec-validator>=0.9.0",
    "datamodel-code-generator>=0.86.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations/versions", "api/schemas/contract.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
